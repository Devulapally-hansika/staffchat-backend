<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>01</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="01" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ==================== 1. LOGIN SCREEN ==================== -->
  <div id="view-login" class="screen">
    <div class="login-container">
      <div class="logo-box">
        <img src="https://originsivf.com/wp-content/uploads/2023/07/origins-logo.png" alt="Origins IVF" class="hospital-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1041/1041916.png'" />
      </div>

      <div class="code-badge">01</div>
      <div id="login-error" class="alert-error"></div>

      <form id="form-login" class="form-body">
        <div class="input-wrapper">
          <input type="text" id="login-empId" placeholder="Employee ID" required />
        </div>

        <div class="input-wrapper password-box">
          <input type="password" id="login-password" placeholder="Password" required />
          <span id="toggle-password" class="eye-icon">👁️</span>
        </div>

        <button type="submit" id="btn-login-submit" class="btn-teal">LOGIN</button>
      </form>

      <a href="#" class="forgot-link">Forgot Password?</a>

      <footer class="login-footer">
        <div>📞 80059 80039 &nbsp;|&nbsp; ✉️ Info@originsivf.com</div>
        <div>🌐 originsivf.com</div>
      </footer>
    </div>
  </div>

  <!-- ==================== 2. MAIN CHATS LIST SCREEN ==================== -->
  <div id="view-main" class="screen hidden">
    <header class="app-bar">
      <h1>My Chats</h1>
      <button id="btn-settings-gear" class="icon-btn">⚙️</button>
    </header>

    <div class="search-container">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search employee ID or group..." />
      </div>
    </div>

    <!-- Active Chat List (Matches Screenshot 1) -->
    <main class="chat-list" id="chat-list-container">
      <!-- Chat conversations render here dynamically -->
    </main>

    <!-- Floating Action Buttons -->
    <div class="fab-stack">
      <button id="fab-group" class="fab" title="New Group">
        <svg viewBox="0 0 24 24" fill="white" width="22" height="22">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
      </button>

      <!-- ADMIN ONLY: Add Employee Button -->
      <button id="fab-add-emp" class="fab hidden" title="Add New Employee">
        <svg viewBox="0 0 24 24" fill="white" width="22" height="22">
          <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </button>

      <button id="fab-start-chat" class="fab" title="Start Chat">
        <svg viewBox="0 0 24 24" fill="white" width="24" height="24">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ==================== 3. 1-ON-1 CHAT ROOM (Matches Screenshot 2) ==================== -->
  <div id="view-conversation" class="screen hidden">
    <header class="app-bar chat-room-bar">
      <div class="chat-header-left">
        <button id="btn-back-to-list" class="icon-btn back-btn">←</button>
        <div class="chat-avatar-icon">👤</div>
        <h2 id="active-chat-name">ADMIN01</h2>
      </div>
    </header>

    <!-- Message stream with beige background -->
    <div id="messages-stream" class="chat-room-body"></div>

    <!-- Bottom Input Bar with Paperclip & Send Button -->
    <footer class="chat-room-footer">
      <label for="file-attachment" class="attachment-btn" title="Attach image or file">📎</label>
      <input type="file" id="file-attachment" class="hidden" />

      <div class="input-pill">
        <input type="text" id="chat-text-input" placeholder="Type a message" autocomplete="off" />
      </div>

      <button id="btn-send-message" class="btn-send-teal">Send</button>
    </footer>
  </div>

  <!-- ==================== MODALS ==================== -->
  <!-- Settings Modal -->
  <div id="modal-settings" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>Settings</h3>
      <div class="menu-item" id="btn-change-pwd">🔑 Change Password</div>
      <div class="menu-item" id="btn-logout">🚪 Logout</div>
    </div>
  </div>
<!-- Long Press Message Action Modal -->
<div id="modal-message-actions" class="modal-overlay hidden">
  <div class="modal-card action-sheet-card">
    <div class="modal-header">
      <h3 style="margin: 0; font-size: 16px;">Message Options</h3>
    </div>
    <div class="modal-body" style="padding: 12px 0;">
      <button id="btn-action-delete" class="action-sheet-btn text-danger" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 20px; background: none; border: none; font-size: 15px; color: #e53935; cursor: pointer;">
        <span>🗑️</span> Delete for everyone
      </button>
      <button id="btn-action-copy" class="action-sheet-btn" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 20px; background: none; border: none; font-size: 15px; color: #333; cursor: pointer;">
        <span>📋</span> Copy text
      </button>
    </div>
    <div class="modal-footer" style="padding: 10px 16px; border-top: 1px solid #eee; text-align: right;">
      <button id="btn-cancel-actions" class="btn-secondary" style="padding: 8px 16px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer;">Cancel</button>
    </div>
  </div>
</div>
  <!-- Add New Employee Modal (Admin Only) -->
  <div id="modal-add-emp" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>Add New Employee</h3>
      <form id="form-add-emp">
        <input type="text" id="new-empId" placeholder="Employee ID (e.g. EMP123)" required />
        <input type="text" id="new-name" placeholder="Full Name" required />
        <input type="email" id="new-email" placeholder="Email" required />
        <select id="new-role" required>
          <option value="" disabled selected>Role: ADMIN / EMPLOYEE / STAFF</option>
          <option value="EMPLOYEE">EMPLOYEE</option>
          <option value="STAFF">STAFF</option>
          <option value="ADMIN">ADMIN</option>
        </select>
        <input type="password" id="new-password" placeholder="Password" required />
        <div class="modal-actions">
          <button type="button" class="btn-text" id="btn-cancel-add-emp">CANCEL</button>
          <button type="submit" class="btn-text action-teal">CREATE</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Start Chat With... Modal -->
  <div id="modal-start-chat" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>Start chat with...</h3>
      <div id="user-selection-list" class="user-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn-text" id="btn-cancel-start-chat">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- New Group Modal -->
  <div id="modal-group" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>New Group</h3>
      <input type="text" id="group-name-input" placeholder="Group Name" />
      <div class="modal-actions">
        <button type="button" class="btn-text" id="btn-cancel-group">CANCEL</button>
        <button type="button" class="btn-text action-teal" id="btn-next-group">NEXT</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
